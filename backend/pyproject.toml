[project]
name = "signcast-ai-backend"
version = "0.1.0"
description = "FastAPI service for SignCast AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic-settings>=2.5.2",
  "httpx>=0.27.2",
  "python-multipart>=0.0.12",
  "openai>=1.51.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.3",
  "redis>=5.1.1",
  "apscheduler>=3.10.4",
  "supabase>=2.7.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "freezegun>=1.5.1",
  "ruff>=0.6.9"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
